name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile all Python files (catches syntax errors)
        run: |
          python -m compileall -q scripts/ tests/
          echo "All scripts compiled successfully."

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (lint)
        run: ruff check scripts/ tests/ --output-format=github

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        run: pytest tests/ -v

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all JSON files in knowledge_base/
        run: |
          python - <<'EOF'
          import json
          import pathlib
          import sys

          failed = False
          for path in pathlib.Path("knowledge_base").rglob("*.json"):
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
                  print(f"OK   {path}")
              except json.JSONDecodeError as e:
                  print(f"FAIL {path}: {e}")
                  failed = True

          if failed:
              sys.exit(1)
          EOF

      - name: Check required fields on each Q&A entry
        run: |
          python - <<'EOF'
          import json
          import pathlib
          import sys

          REQUIRED = {"id", "topic", "question", "answer_type"}
          failed = False

          for path in pathlib.Path("knowledge_base").glob("qa_master_deduped.json"):
              data = json.load(open(path, encoding="utf-8"))
              for entry in data:
                  missing = REQUIRED - entry.keys()
                  if missing:
                      print(f"FAIL {path}: entry {entry.get('id', '?')} missing fields {missing}")
                      failed = True
                  # an entry claiming to be answered must actually have an answer
                  if entry.get("answer_type") != "unanswered" and not entry.get("answer"):
                      print(f"FAIL {path}: entry {entry.get('id', '?')} has answer_type="
                            f"{entry.get('answer_type')} but no answer text")
                      failed = True

          if failed:
              sys.exit(1)
          print("All entries have required fields.")
          EOF

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
